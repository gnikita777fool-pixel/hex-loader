name: Build and Release Hex Loader

on:
  push:
    tags:
      - 'v*' # Запускать только при создании тега версии (v1.0.0, v1.2.3 и т.д.)
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: hex-loader-linux-amd64
            build_cmd: go build -ldflags="-s -w" -o hex-loader-linux-amd64
          - os: windows-latest
            artifact_name: hex-loader-windows-amd64.exe
            build_cmd: go build -ldflags="-s -w" -o hex-loader-windows-amd64.exe
          - os: macos-latest
            artifact_name: hex-loader-darwin-amd64
            build_cmd: go build -ldflags="-s -w" -o hex-loader-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Fyne v2.8 требует современный Go

      - name: Install Linux dependencies (Fyne requirement)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Download Go modules
        run: go mod download

      - name: Build Binary
        env:
          CGO_ENABLED: 1 # Критично для Fyne!
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}