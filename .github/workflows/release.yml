name: Build and Release Hex Loader

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # ← ЭТО КЛЮЧЕВОЕ ДОБАВЛЕНИЕ! Разрешает создание релизов

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            libx11-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install gcc

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=1 go build -o HexLoader-linux-amd64 .
        env:
          CGO_ENABLED: 1

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go build -o HexLoader-windows-amd64.exe .

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: |
          CGO_ENABLED=1 go build -o HexLoader-darwin-amd64 .
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexLoader-${{ matrix.os }}
          path: HexLoader-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}